policy_name: holobrain_robodojo_policy
protocol: ws
host: localhost
port: null
bench_name: RoboDojo
task_name: null
ckpt_name: null
env_cfg_type: arx_x5
seed: 0
action_type: joint
gpu_id: null
# Default, no longer a correctness requirement. It used to be: every env
# shared this policy's single episode identity, so N envs read and wrote one
# memory bank, and deploy_policy raised rather than let that happen. Each
# forward now carries its own key (deploy_policy._episode_key) and
# _autoreset_for_eval no longer clears the envs outside the current
# single-element batch.
#
# Still false here so ordinary runs keep the single-env path.
# `robodojo_eval.py --num_envs N` sets $ROBODOJO_EVAL_BATCH, which
# XPolicyLab/utils/setup_env_client.sh prefers over this value -- main.py caps
# num_envs at 1 while eval_batch is false.
eval_batch: false

model_dir: null
model_processor: robodojo_processor
model_prefix: model
load_impl: native
vlm_ckpt_dir: null
urdf_dir: null
valid_action_step: 32
use_depth: false
extrinsic_type: cam2world_usd
